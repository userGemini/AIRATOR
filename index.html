<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIRATOR · Monitoring Kualitas Air IoT</title>
<meta name="theme-color" content="#061a26">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --depth:#061a26;
    --current:#0d3349;
    --surface:#123f55;
    --surface-2:#1a526c;
    --foam:#eef6f6;
    --foam-dim:#93b2c0;
    --tide:#2dd4bf;
    --tide-dim:rgba(45,212,191,.16);
    --coral:#fb7185;
    --coral-dim:rgba(251,113,133,.16);
    --amber:#fbbf24;
    --amber-dim:rgba(251,191,36,.16);
    --violet:#a78bfa;
    --violet-dim:rgba(167,139,250,.16);
    --line:rgba(255,255,255,.09);
    --radius:18px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
    --nav-h:68px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse 1200px 600px at 50% -10%, #0f3f57 0%, var(--depth) 60%), var(--depth);
    color:var(--foam);
    font-family:var(--font-body);
    min-height:100vh;
    padding-bottom:var(--nav-h);
  }
  a{color:var(--tide);}
  button{font-family:var(--font-body);cursor:pointer;}
  input,select{font-family:var(--font-mono);}
  ::selection{background:var(--tide-dim);}
  :focus-visible{outline:2px solid var(--tide);outline-offset:2px;}

  /* -------- Header -------- */
  header.topbar{
    position:relative;
    background:linear-gradient(180deg,#0a2a3c 0%, var(--depth) 100%);
    border-bottom:1px solid var(--line);
    padding:18px 24px 30px;
    overflow:hidden;
  }
  .topbar-row{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:38px;height:38px;border-radius:10px;
    background:linear-gradient(135deg,var(--tide),#0e7c70);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;color:#03201b;font-size:18px;
    box-shadow:0 0 22px rgba(45,212,191,.35);flex-shrink:0;
  }
  .brand h1{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.01em;margin:0;}
  .brand p{margin:1px 0 0;font-size:12.5px;color:var(--foam-dim);}
  .topbar-actions{display:flex;align-items:center;gap:10px;}
  .status-pill{
    display:flex;align-items:center;gap:8px;
    background:var(--current);border:1px solid var(--line);
    padding:8px 14px;border-radius:999px;font-size:12.5px;font-family:var(--font-mono);color:var(--foam-dim);
  }
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--foam-dim);flex-shrink:0;}
  .status-pill[data-state="demo"] .status-dot{background:var(--amber);animation:pulse-amber 1.6s infinite;}
  .status-pill[data-state="connecting"] .status-dot{background:var(--amber);animation:pulse-amber 1s infinite;}
  .status-pill[data-state="live"] .status-dot{background:var(--tide);animation:pulse-tide 1.6s infinite;}
  .status-pill[data-state="offline"] .status-dot{background:var(--coral);}
  @keyframes pulse-tide{0%{box-shadow:0 0 0 0 rgba(45,212,191,.55);}70%{box-shadow:0 0 0 9px rgba(45,212,191,0);}100%{box-shadow:0 0 0 0 rgba(45,212,191,0);}}
  @keyframes pulse-amber{0%{box-shadow:0 0 0 0 rgba(251,191,36,.55);}70%{box-shadow:0 0 0 9px rgba(251,191,36,0);}100%{box-shadow:0 0 0 0 rgba(251,191,36,0);}}
  .wave-wrap{position:absolute;left:0;right:0;bottom:-1px;height:26px;overflow:hidden;line-height:0;}
  .wave-wrap svg{width:200%;height:100%;animation:wave-shift 14s linear infinite;}
  @media (prefers-reduced-motion:reduce){.wave-wrap svg{animation:none;}}
  @keyframes wave-shift{from{transform:translateX(0);}to{transform:translateX(-50%);}}

  /* -------- Screens -------- */
  .screen{display:none;}
  .screen.active{display:block;}

  /* -------- HOME screen -------- */
  .dashboard{
    max-width:1400px;margin:0 auto;padding:22px 24px 24px;
    display:grid;grid-template-columns:minmax(300px,42%) 1fr;gap:20px;align-items:start;
  }
  @media (max-width:980px){.dashboard{grid-template-columns:1fr;}}

  .panel{
    background:linear-gradient(160deg,var(--current),#0a2c3e);
    border:1px solid var(--line);border-radius:var(--radius);padding:16px;
  }
  .panel h2{
    font-family:var(--font-display);font-size:14px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--foam-dim);margin:2px 4px 12px;font-weight:600;
  }
  #map{height:440px;border-radius:12px;overflow:hidden;border:1px solid var(--line);}
  .map-meta{
    display:flex;justify-content:space-between;gap:10px;margin-top:10px;padding:0 4px;
    font-family:var(--font-mono);font-size:11.5px;color:var(--foam-dim);flex-wrap:wrap;
  }

  .sensor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width:640px){.sensor-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:420px){.sensor-grid{grid-template-columns:1fr;}}

  .card{
    position:relative;
    background:linear-gradient(165deg,var(--surface),var(--current));
    border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 14px 12px;
    transition:box-shadow .35s ease, opacity .3s ease, border-color .35s ease;
  }
  .card[data-level="good"]{border-color:rgba(45,212,191,.4);box-shadow:0 0 0 1px rgba(45,212,191,.08),0 0 26px -8px rgba(45,212,191,.45);}
  .card[data-level="warning"]{border-color:rgba(251,191,36,.4);box-shadow:0 0 0 1px rgba(251,191,36,.08),0 0 26px -8px rgba(251,191,36,.4);}
  .card[data-level="danger"]{border-color:rgba(251,113,133,.45);box-shadow:0 0 0 1px rgba(251,113,133,.08),0 0 26px -8px rgba(251,113,133,.5);}
  .card.stale{opacity:.5;}
  .card-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;}
  .card-head h3{font-family:var(--font-display);font-size:14px;font-weight:600;margin:0;}
  .card-head .level-tag{
    font-family:var(--font-mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
    padding:2px 6px;border-radius:5px;color:var(--foam-dim);background:rgba(255,255,255,.06);
  }
  .card[data-level="good"] .level-tag{color:var(--tide);background:var(--tide-dim);}
  .card[data-level="warning"] .level-tag{color:var(--amber);background:var(--amber-dim);}
  .card[data-level="danger"] .level-tag{color:var(--coral);background:var(--coral-dim);}
  .gauge-wrap{display:block;margin:2px auto 0;}
  .gauge-wrap svg{display:block;width:100%;height:auto;}
  .value-row{display:flex;align-items:baseline;justify-content:center;gap:4px;margin-top:-22px;}
  .value-row .num{font-family:var(--font-mono);font-size:26px;font-weight:600;}
  .value-row .unit{font-family:var(--font-mono);font-size:11.5px;color:var(--foam-dim);}
  .sparkline{display:block;width:100%;height:26px;margin-top:6px;}
  .sparkline polyline{fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;}
  .updated{font-family:var(--font-mono);font-size:10.5px;color:var(--foam-dim);text-align:center;margin-top:6px;}

  /* -------- CONTROL screen -------- */
  .ctrl-wrap{
    max-width:700px;margin:0 auto;padding:28px 24px;
    display:flex;flex-direction:column;gap:20px;
  }
  .ctrl-card{
    background:linear-gradient(160deg,var(--current),#0a2c3e);
    border:1px solid var(--line);border-radius:var(--radius);padding:24px;
  }
  .ctrl-card h2{
    font-family:var(--font-display);font-size:15px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--foam-dim);margin:0 0 18px;
  }

  /* Frequency slider */
  .freq-display{
    font-family:var(--font-mono);font-size:56px;font-weight:600;
    text-align:center;color:var(--tide);letter-spacing:-.02em;line-height:1;margin-bottom:4px;
  }
  .freq-unit{text-align:center;font-family:var(--font-mono);font-size:13px;color:var(--foam-dim);margin-bottom:20px;}
  .freq-slider{
    -webkit-appearance:none;appearance:none;
    width:100%;height:8px;border-radius:4px;
    background:linear-gradient(to right, var(--tide) 0%, var(--tide) var(--pct,50%), rgba(255,255,255,.12) var(--pct,50%), rgba(255,255,255,.12) 100%);
    outline:none;cursor:pointer;
  }
  .freq-slider::-webkit-slider-thumb{
    -webkit-appearance:none;width:26px;height:26px;border-radius:50%;
    background:var(--tide);border:3px solid var(--foam);
    box-shadow:0 0 12px rgba(45,212,191,.6);cursor:pointer;
  }
  .freq-slider::-moz-range-thumb{
    width:26px;height:26px;border-radius:50%;
    background:var(--tide);border:3px solid var(--foam);
    box-shadow:0 0 12px rgba(45,212,191,.6);cursor:pointer;
  }
  .freq-range-labels{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:var(--foam-dim);margin-top:8px;}
  .freq-presets{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .preset-btn{
    flex:1;min-width:60px;padding:8px 12px;
    border:1px solid var(--line);border-radius:10px;
    background:var(--surface);color:var(--foam-dim);
    font-family:var(--font-mono);font-size:12px;
    transition:border-color .2s, color .2s, background .2s;
  }
  .preset-btn:hover,.preset-btn.active{
    border-color:var(--tide);color:var(--tide);background:var(--tide-dim);
  }

  /* Start / Stop */
  .ctrl-buttons{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px;}
  .run-btn{
    padding:18px;border-radius:14px;font-size:16px;font-weight:600;
    border:2px solid;display:flex;align-items:center;justify-content:center;gap:10px;
    transition:background .2s, box-shadow .2s, transform .1s;
  }
  .run-btn:active{transform:scale(.97);}
  .run-btn.start{
    background:var(--tide);border-color:var(--tide);color:#03201b;
    box-shadow:0 0 26px rgba(45,212,191,.4);
  }
  .run-btn.start:disabled{background:rgba(45,212,191,.2);border-color:rgba(45,212,191,.3);color:var(--foam-dim);box-shadow:none;}
  .run-btn.stop{
    background:var(--coral-dim);border-color:var(--coral);color:var(--coral);
    box-shadow:0 0 18px rgba(251,113,133,.25);
  }
  .run-btn.stop:disabled{background:rgba(251,113,133,.05);border-color:rgba(251,113,133,.2);color:rgba(251,113,133,.35);box-shadow:none;}
  .vfd-status{
    text-align:center;font-family:var(--font-mono);font-size:12px;
    padding:10px;border-radius:10px;background:rgba(255,255,255,.04);color:var(--foam-dim);margin-top:4px;
  }
  .vfd-status.running{color:var(--tide);}
  .vfd-status.stopped{color:var(--coral);}

  /* -------- STATUS screen -------- */
  .status-wrap{
    max-width:900px;margin:0 auto;padding:28px 24px;
    display:flex;flex-direction:column;gap:20px;
  }
  .power-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media (max-width:560px){.power-grid{grid-template-columns:1fr;}}

  .pwr-card{
    background:linear-gradient(165deg,var(--surface),var(--current));
    border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 16px 18px;text-align:center;
    transition:border-color .3s, box-shadow .3s;
  }
  .pwr-card.v-card{border-color:rgba(167,139,250,.35);box-shadow:0 0 22px -8px rgba(167,139,250,.4);}
  .pwr-card.a-card{border-color:rgba(251,191,36,.35);box-shadow:0 0 22px -8px rgba(251,191,36,.35);}
  .pwr-card.w-card{border-color:rgba(45,212,191,.35);box-shadow:0 0 22px -8px rgba(45,212,191,.4);}
  .pwr-icon{font-size:30px;margin-bottom:8px;}
  .pwr-label{font-family:var(--font-display);font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--foam-dim);margin-bottom:10px;}
  .pwr-value{font-family:var(--font-mono);font-size:42px;font-weight:600;line-height:1;}
  .pwr-unit{font-family:var(--font-mono);font-size:12px;color:var(--foam-dim);margin-top:4px;}
  .v-card .pwr-value{color:var(--violet);}
  .a-card .pwr-value{color:var(--amber);}
  .w-card .pwr-value{color:var(--tide);}

  /* Power sparkline chart */
  .power-chart-card{
    background:linear-gradient(160deg,var(--current),#0a2c3e);
    border:1px solid var(--line);border-radius:var(--radius);padding:20px;
  }
  .power-chart-card h2{
    font-family:var(--font-display);font-size:14px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--foam-dim);margin:0 0 14px;
  }
  .pwr-history-svg{width:100%;height:80px;display:block;}
  .pwr-history-svg polyline{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
  .chart-legend{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--foam-dim);}
  .legend-dot{width:10px;height:10px;border-radius:3px;}

  /* -------- Bottom Nav -------- */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);
    background:linear-gradient(180deg,rgba(6,26,38,0) 0, rgba(6,26,38,.97) 30%);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    display:flex;align-items:stretch;justify-content:center;
    z-index:100;padding:0 12px;
  }
  .nav-tabs{display:flex;gap:4px;align-items:center;width:100%;max-width:540px;}
  .nav-tab{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    padding:8px 10px;border-radius:14px;border:1px solid transparent;
    background:transparent;color:var(--foam-dim);
    font-size:11px;font-family:var(--font-body);font-weight:500;
    transition:color .2s, background .2s, border-color .2s;cursor:pointer;
  }
  .nav-tab .tab-icon{font-size:22px;line-height:1;transition:transform .2s;}
  .nav-tab:hover{color:var(--foam);background:rgba(255,255,255,.05);}
  .nav-tab.active{
    color:var(--tide);background:var(--tide-dim);border-color:rgba(45,212,191,.3);
  }
  .nav-tab.active .tab-icon{transform:scale(1.1);}

  footer{
    max-width:1400px;margin:0 auto;padding:0 24px 16px;
    font-size:11.5px;color:var(--foam-dim);text-align:center;
  }

  /* -------- Shared utils -------- */
  .btn{
    border:1px solid var(--line);background:var(--current);color:var(--foam);
    padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:500;
    display:inline-flex;align-items:center;gap:8px;transition:border-color .2s, background .2s;
  }
  .btn:hover{border-color:var(--tide);}
  .btn.primary{background:var(--tide);color:#03201b;border-color:var(--tide);font-weight:600;}
  .btn.primary:hover{background:#3fe0c9;}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div>
        <h1>AIRATOR</h1>
        <!-- <p>Monitoring kualitas air real-time &middot; HiveMQ MQTT</p> -->
      </div>
    </div>
    <div class="topbar-actions">
      <div class="status-pill" id="statusPill" data-state="demo">
        <span class="status-dot"></span>
        <span id="statusText">Live</span>
      </div>
    </div>
  </div>
  <div class="wave-wrap" aria-hidden="true">
    <svg viewBox="0 0 1600 60" preserveAspectRatio="none">
      <path d="M0,30 C 200,60 400,0 600,30 C 800,60 1000,0 1200,30 C 1400,60 1500,15 1600,30 L1600,60 L0,60 Z
               M1600,30 C 1800,60 2000,0 2200,30 C 2400,60 2600,0 2800,30 C 3000,60 3100,15 3200,30 L3200,60 L1600,60 Z"
            fill="#0a2a3c"/>
    </svg>
  </div>
</header>

<!-- ============ HOME SCREEN ============ -->
<div class="screen active" id="screen-home">
  <main class="dashboard">
    <section class="panel" aria-label="Lokasi node">
      <h2>Lokasi Node</h2>
      <div id="map"></div>
      <div class="map-meta">
        <!-- <span id="mapCoords">Lat —, Lng —</span>
        <span id="mapSource">sumber: default</span> -->
      </div>
    </section>
    <section aria-label="Pembacaan sensor">
      <div class="sensor-grid" id="sensorGrid"></div>
    </section>
  </main>
  <footer>
    <!-- Terhubung ke broker HiveMQ via MQTT-over-WebSocket. Mode simulasi aktif secara default — konfigurasi koneksi tersimpan di dalam file ini. -->
  </footer>
</div>

<!-- ============ CONTROL SCREEN ============ -->
<div class="screen" id="screen-control">
  <div class="ctrl-wrap">
    <div class="ctrl-card">
      <h2>Frekuensi VFD</h2>
      <div class="freq-display" id="freqDisplay">30.0</div>
      <div class="freq-unit">Hz</div>
      <input type="range" class="freq-slider" id="freqSlider" min="0" max="50" step="0.5" value="30">
      <div class="freq-range-labels"><span>0 Hz</span><span>30 Hz</span><span>50 Hz</span></div>
      <div class="freq-presets">
        <button class="preset-btn" data-freq="10">10 Hz</button>
        <button class="preset-btn" data-freq="20">20 Hz</button>
        <button class="preset-btn active" data-freq="30">30 Hz</button>
        <button class="preset-btn" data-freq="40">40 Hz</button>
        <button class="preset-btn" data-freq="50">50 Hz</button>
        <!-- <button class="preset-btn" data-freq="60">60 Hz</button> -->
      </div>
    </div>

    <div class="ctrl-card">
      <h2>Kontrol Motor</h2>
      <div class="ctrl-buttons">
        <button class="run-btn start" id="btnStart">
          <span>▶</span> START
        </button>
        <button class="run-btn stop" id="btnStop" disabled>
          <span>⏹</span> STOP
        </button>
      </div>
      <div class="vfd-status stopped" id="vfdStatus">● Motor berhenti</div>
    </div>
  </div>
</div>

<!-- ============ STATUS SCREEN ============ -->
<div class="screen" id="screen-status">
  <div class="status-wrap">
    <div class="power-grid">
      <div class="pwr-card v-card">
        <div class="pwr-icon">⚡</div>
        <div class="pwr-label">Tegangan</div>
        <div class="pwr-value" id="pwrV">—</div>
        <div class="pwr-unit">Volt</div>
      </div>
      <div class="pwr-card a-card">
        <div class="pwr-icon">〰️</div>
        <div class="pwr-label">Arus</div>
        <div class="pwr-value" id="pwrA">—</div>
        <div class="pwr-unit">Ampere</div>
      </div>
      <div class="pwr-card w-card">
        <div class="pwr-icon">🔋</div>
        <div class="pwr-label">Daya</div>
        <div class="pwr-value" id="pwrW">—</div>
        <div class="pwr-unit">Watt</div>
      </div>
    </div>

    <div class="power-chart-card">
      <h2>Riwayat Daya (30 pembacaan terakhir)</h2>
      <svg class="pwr-history-svg" id="pwrChart" viewBox="0 0 600 80" preserveAspectRatio="none">
        <polyline id="lineV" stroke="var(--violet)" points=""/>
        <polyline id="lineA" stroke="var(--amber)" points=""/>
        <polyline id="lineW" stroke="var(--tide)" points=""/>
      </svg>
      <div class="chart-legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--violet)"></div>Tegangan</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--amber)"></div>Arus</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--tide)"></div>Daya</div>
      </div>
    </div>
  </div>
</div>

<!-- ============ BOTTOM NAV ============ -->
<nav class="bottom-nav" aria-label="Navigasi layar">
  <div class="nav-tabs">
    <button class="nav-tab active" data-screen="home" onclick="switchScreen('home',this)">
      <span class="tab-icon">🌊</span>
      <span>Monitoring</span>
    </button>
    <button class="nav-tab" data-screen="control" onclick="switchScreen('control',this)">
      <span class="tab-icon">🎛️</span>
      <span>Kontrol VFD</span>
    </button>
    <button class="nav-tab" data-screen="status" onclick="switchScreen('status',this)">
      <span class="tab-icon">📊</span>
      <span>Status Daya</span>
    </button>
  </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(function(){
"use strict";

/* ======================================================
   KONFIGURASI MQTT — ubah di sini
   ====================================================== */
var MQTT_CONFIG = {
  host:     "eb4e1d970eb448f99b741a9ba4d6eacc.s1.eu.hivemq.cloud",   // host broker
  port:     8884,                   // port WebSocket (8884 = wss, 8083 = ws)
  path:     "/mqtt",
  tls:      true,                   // true = wss://, false = ws://
  username: "AIRATOR",                     // kosongkan jika tidak pakai auth
  password: "airatorPPNS1",                     // kosongkan jika tidak pakai auth
  clientId: "aquascope-" + Math.random().toString(16).slice(2,10),
  prefix:   "aquascope/sensors",    // prefix topik sensor
  mode:     "json",               // "single" atau "json"
  jsonTopic:"aquascope/sensors/all",// hanya untuk mode json
  locTopic: "aquascope/sensors/location",
  // Topik VFD (ESP32)
  vfdFreqTopic: "aquascope/vfd/freq",
  vfdCmdTopic:  "aquascope/vfd/cmd",   // publish "START" / "STOP"
  vfdStatTopic: "aquascope/vfd/status",
  // Topik daya listrik
  voltTopic:  "aquascope/power/voltage",
  ampTopic:   "aquascope/power/current",
  wattTopic:  "aquascope/power/watt",
  // Koordinat node default -7.278811, 112.793503
  defaultLat: -7.278811,
  defaultLng: 112.793503
};

/* ======================================================
   Konfigurasi sensor air
   ====================================================== */
var SENSORS = [
  { id:"ph",        label:"pH",           unit:"",     min:0, max:14,   decimals:2, suffix:"ph",
    zones:[{from:0,to:5.5,level:"danger"},{from:5.5,to:6.5,level:"warning"},{from:6.5,to:8.5,level:"good"},{from:8.5,to:9.5,level:"warning"},{from:9.5,to:14,level:"danger"}],
    demoBase:7.2, demoJitter:0.25 },
  { id:"turbidity", label:"Turbidity",    unit:"NTU",  min:0, max:50,   decimals:1, suffix:"turbidity",
    zones:[{from:0,to:5,level:"good"},{from:5,to:20,level:"warning"},{from:20,to:50,level:"danger"}],
    demoBase:4, demoJitter:2.5 },
  { id:"tds",       label:"TDS",          unit:"ppm",  min:0, max:2000, decimals:0, suffix:"tds",
    zones:[{from:0,to:500,level:"good"},{from:500,to:1000,level:"warning"},{from:1000,to:2000,level:"danger"}],
    demoBase:380, demoJitter:60 },
  { id:"salinity",  label:"Salinity",     unit:"ppt",  min:0, max:40,   decimals:2, suffix:"salinity",
    zones:[{from:0,to:0.5,level:"good"},{from:0.5,to:5,level:"warning"},{from:5,to:40,level:"danger"}],
    demoBase:0.3, demoJitter:0.15 },
  { id:"do",        label:"Dissolved O₂", unit:"mg/L", min:0, max:20,   decimals:2, suffix:"do",
    zones:[{from:0,to:3,level:"danger"},{from:3,to:5,level:"warning"},{from:5,to:20,level:"good"}],
    demoBase:6.5, demoJitter:0.8 },
  { id:"temp",      label:"Temperature",  unit:"°C",   min:0, max:50,   decimals:1, suffix:"temp",
    zones:[{from:0,to:20,level:"warning"},{from:20,to:30,level:"good"},{from:30,to:50,level:"danger"}],
    demoBase:28, demoJitter:1.2 }
];
var HISTORY_LEN = 30;
var STALE_MS = 15000;

var state = {};
SENSORS.forEach(function(s){
  state[s.id] = { value:null, history:[], lastUpdate:null, demoCurrent:s.demoBase };
});

// Power state
var powerState = { v:null, a:null, w:null, histV:[], histA:[], histW:[] };
var powerDemoBase = { v:220, a:2.5, w:550 };

// VFD state
var vfdRunning = false;

var mqttClient = null;
var demoTimer = null;
var freshnessTimer = null;
var marker = null, map = null;

/* ======================================================
   Util
   ====================================================== */
function $(id){ return document.getElementById(id); }
function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
function fmt(s, raw){ return (raw===null||raw===undefined||isNaN(raw)) ? "—" : Number(raw).toFixed(s.decimals); }
function fmtPwr(v, d){ return (v===null||v===undefined||isNaN(v)) ? "—" : Number(v).toFixed(d||1); }
function valueToAngle(s,v){ var t=clamp((v-s.min)/(s.max-s.min),0,1); return 180+t*180; }
function polarToCartesian(cx,cy,r,a){ a=a*Math.PI/180; return {x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)}; }
function describeArc(cx,cy,r,s,e){
  var st=polarToCartesian(cx,cy,r,s), en=polarToCartesian(cx,cy,r,e);
  return ["M",st.x,st.y,"A",r,r,0,(e-s)>180?"1":"0",1,en.x,en.y].join(" ");
}
function levelColor(l){ return l==="good"?"var(--tide)":l==="warning"?"var(--amber)":l==="danger"?"var(--coral)":"var(--foam-dim)"; }
function levelOf(s,v){
  if(v===null||v===undefined||isNaN(v)) return null;
  for(var i=0;i<s.zones.length;i++){ var z=s.zones[i]; if(v>=z.from&&v<=z.to) return z.level; }
  return null;
}

/* ======================================================
   Screen switching
   ====================================================== */
window.switchScreen = function(name, btn){
  document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("active"); });
  document.querySelectorAll(".nav-tab").forEach(function(t){ t.classList.remove("active"); });
  $("screen-" + name).classList.add("active");
  btn.classList.add("active");
  if(name==="home" && map){ setTimeout(function(){ map.invalidateSize(); },100); }
};

/* ======================================================
   Gauge card building
   ====================================================== */
var CX=100, CY=96, R=78, STROKE=13, NEEDLE_LEN=64;
function buildGaugeSVG(s){
  var zp = s.zones.map(function(z){
    return '<path d="'+describeArc(CX,CY,R,valueToAngle(s,z.from),valueToAngle(s,z.to))+
           '" stroke="'+levelColor(z.level)+'" stroke-width="'+STROKE+'" fill="none" stroke-linecap="butt" opacity="0.9"></path>';
  }).join("");
  return '<svg viewBox="0 0 200 112" class="gauge-svg" data-id="'+s.id+'">'+
    '<path d="'+describeArc(CX,CY,R,180,360)+'" stroke="rgba(255,255,255,.07)" stroke-width="'+STROKE+'" fill="none"></path>'+
    zp+
    '<line class="needle" x1="'+CX+'" y1="'+CY+'" x2="'+CX+'" y2="'+(CY-NEEDLE_LEN)+
    '" stroke="#eef6f6" stroke-width="4" stroke-linecap="round"></line>'+
    '<circle cx="'+CX+'" cy="'+CY+'" r="6.5" fill="#eef6f6"></circle>'+
    '<circle cx="'+CX+'" cy="'+CY+'" r="3" fill="var(--current)"></circle>'+
    '</svg>';
}
function buildCard(s){
  var card = document.createElement("article");
  card.className="card"; card.id="card-"+s.id; card.setAttribute("data-level","");
  card.innerHTML=
    '<div class="card-head"><h3>'+s.label+'</h3><span class="level-tag" id="tag-'+s.id+'">—</span></div>'+
    '<div class="gauge-wrap">'+buildGaugeSVG(s)+'</div>'+
    '<div class="value-row"><span class="num" id="num-'+s.id+'">—</span><span class="unit">'+s.unit+'</span></div>'+
    '<svg class="sparkline" id="spark-'+s.id+'" viewBox="0 0 120 28" preserveAspectRatio="none"><polyline points=""></polyline></svg>'+
    '<div class="updated" id="upd-'+s.id+'">belum ada data</div>';
  return card;
}
var grid=$("sensorGrid");
SENSORS.forEach(function(s){ grid.appendChild(buildCard(s)); });

/* ======================================================
   Render sensor card
   ====================================================== */
function renderSensor(s){
  var st=state[s.id], v=st.value;
  var card=$("card-"+s.id);
  var needle=card.querySelector(".needle");
  var angle=valueToAngle(s, v===null?s.min:v);
  var tip=polarToCartesian(CX,CY,NEEDLE_LEN,angle);
  needle.setAttribute("x2",tip.x.toFixed(2));
  needle.setAttribute("y2",tip.y.toFixed(2));
  $("num-"+s.id).textContent=fmt(s,v);
  var lvl=levelOf(s,v);
  card.setAttribute("data-level",lvl||"");
  $("tag-"+s.id).textContent=lvl?(lvl==="good"?"Normal":lvl==="warning"?"Waspada":"Bahaya"):"—";
  var poly=document.querySelector("#spark-"+s.id+" polyline"), hist=st.history;
  if(hist.length>1){
    var vmin=Math.min.apply(null,hist),vmax=Math.max.apply(null,hist),range=(vmax-vmin)||1;
    var pts=hist.map(function(h,i){ return ((i/(HISTORY_LEN-1))*120).toFixed(1)+","+(26-((h-vmin)/range)*22-2).toFixed(1); }).join(" ");
    poly.setAttribute("points",pts); poly.setAttribute("stroke",levelColor(lvl));
  } else { poly.setAttribute("points",""); }
}
function updateSensorValue(id, raw){
  var s=SENSORS.find(function(x){return x.id===id;}); if(!s) return;
  var v=parseFloat(raw); if(isNaN(v)) return;
  var st=state[id]; st.value=v; st.history.push(v);
  if(st.history.length>HISTORY_LEN) st.history.shift();
  st.lastUpdate=Date.now(); renderSensor(s);
}

function refreshTimestamps(){
  SENSORS.forEach(function(s){
    var st=state[s.id], el=$("upd-"+s.id), card=$("card-"+s.id);
    if(st.lastUpdate===null){el.textContent="belum ada data";return;}
    var secs=Math.round((Date.now()-st.lastUpdate)/1000);
    el.textContent=secs<1?"baru saja":"diperbarui "+secs+" dtk lalu";
    if(secs*1000>STALE_MS&&!state.demoActive){card.classList.add("stale");}
    else{card.classList.remove("stale");}
  });
}
freshnessTimer=setInterval(refreshTimestamps,1000);

/* ======================================================
   Power meter rendering
   ====================================================== */
function renderPower(){
  $("pwrV").textContent = fmtPwr(powerState.v,1);
  $("pwrA").textContent = fmtPwr(powerState.a,2);
  $("pwrW").textContent = fmtPwr(powerState.w,0);
  updatePowerChart();
}
function updatePowerChart(){
  var hv=powerState.histV, ha=powerState.histA, hw=powerState.histW;
  var n=hv.length; if(n<2) return;
  function norm(arr,i){ var mn=Math.min.apply(null,arr),mx=Math.max.apply(null,arr),r=(mx-mn)||1; return 72-((arr[i]-mn)/r)*64; }
  function pts(arr){ return arr.map(function(v,i){return ((i/(n-1))*600).toFixed(1)+","+norm(arr,i).toFixed(1);}).join(" "); }
  $("lineV").setAttribute("points",pts(hv));
  $("lineA").setAttribute("points",pts(ha));
  $("lineW").setAttribute("points",pts(hw));
}
function pushPower(v,a,w){
  powerState.v=v; powerState.a=a; powerState.w=w;
  powerState.histV.push(v); powerState.histA.push(a); powerState.histW.push(w);
  if(powerState.histV.length>HISTORY_LEN) powerState.histV.shift();
  if(powerState.histA.length>HISTORY_LEN) powerState.histA.shift();
  if(powerState.histW.length>HISTORY_LEN) powerState.histW.shift();
  renderPower();
}

/* ======================================================
   Map
   ====================================================== */
function initMap(){
  var lat=MQTT_CONFIG.defaultLat, lng=MQTT_CONFIG.defaultLng;
  map=L.map("map",{zoomControl:true,attributionControl:true}).setView([lat,lng],13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
  var icon=L.divIcon({className:"",html:'<div style="width:18px;height:18px;border-radius:50%;background:#2dd4bf;box-shadow:0 0 0 6px rgba(45,212,191,.25),0 0 14px rgba(45,212,191,.7);border:2px solid #eef6f6;"></div>',iconSize:[18,18],iconAnchor:[9,9]});
  marker=L.marker([lat,lng],{icon:icon,draggable:true}).addTo(map);
  marker.on("dragend",function(){ var p=marker.getLatLng(); updateMapMeta(p.lat,p.lng,"manual"); });
  updateMapMeta(lat,lng,"default");
}
function updateMapMeta(lat,lng,src){
  var elCoords=$("mapCoords"), elSource=$("mapSource");
  if(elCoords) elCoords.textContent="Lat "+lat.toFixed(5)+", Lng "+lng.toFixed(5);
  if(elSource) elSource.textContent="sumber: "+src;
}
function updateLocation(lat,lng,src){
  if(!map||isNaN(lat)||isNaN(lng)) return;
  marker.setLatLng([lat,lng]); map.panTo([lat,lng]); updateMapMeta(lat,lng,src||"MQTT");
}

/* ======================================================
   VFD Control UI
   ====================================================== */
var freqSlider=$("freqSlider");
var freqDisplay=$("freqDisplay");

function updateFreqUI(val){
  freqDisplay.textContent=parseFloat(val).toFixed(1);
  var pct=((val-freqSlider.min)/(freqSlider.max-freqSlider.min)*100).toFixed(1)+"%";
  freqSlider.style.setProperty("--pct",pct);
  document.querySelectorAll(".preset-btn").forEach(function(b){
    b.classList.toggle("active", parseFloat(b.dataset.freq)===parseFloat(val));
  });
}
freqSlider.addEventListener("input",function(){
  updateFreqUI(this.value);
  publishFreq(this.value);
});
document.querySelectorAll(".preset-btn").forEach(function(b){
  b.addEventListener("click",function(){
    freqSlider.value=this.dataset.freq;
    updateFreqUI(this.dataset.freq);
    publishFreq(this.dataset.freq);
  });
});
updateFreqUI(freqSlider.value);

function setVFDRunning(running){
  vfdRunning=running;
  $("btnStart").disabled=running;
  $("btnStop").disabled=!running;
  var s=$("vfdStatus");
  if(running){ s.textContent="● Motor berjalan"; s.className="vfd-status running"; }
  else { s.textContent="● Motor berhenti"; s.className="vfd-status stopped"; }
}
$("btnStart").addEventListener("click",function(){
  publishCmd("START"); setVFDRunning(true);
});
$("btnStop").addEventListener("click",function(){
  publishCmd("STOP"); setVFDRunning(false);
});

function publishFreq(val){
  if(mqttClient&&mqttClient.connected){
    mqttClient.publish(MQTT_CONFIG.vfdFreqTopic, String(parseFloat(val).toFixed(1)));
  }
}
function publishCmd(cmd){
  if(mqttClient&&mqttClient.connected){
    mqttClient.publish(MQTT_CONFIG.vfdCmdTopic, cmd);
  }
}

/* ======================================================
   Demo / simulation
   ====================================================== */
function startDemo(){
  stopDemo();
  state.demoActive=true;
  setStatus("demo","Mode Simulasi");
  SENSORS.forEach(function(s){ updateSensorValue(s.id,s.demoBase); });
  pushPower(powerDemoBase.v, powerDemoBase.a, powerDemoBase.w);
  demoTimer=setInterval(function(){
    SENSORS.forEach(function(s){
      var st=state[s.id];
      var next=clamp(st.demoCurrent+(Math.random()-.5)*s.demoJitter,s.min,s.max);
      st.demoCurrent=next; updateSensorValue(s.id,next);
    });
    // simulate power
    var v=clamp(powerState.v+(Math.random()-.5)*4,200,240);
    var a=clamp(powerState.a+(Math.random()-.5)*.4,0.5,8);
    pushPower(v,a,v*a);
  },2000);
}
function stopDemo(){
  state.demoActive=false;
  if(demoTimer){clearInterval(demoTimer);demoTimer=null;}
}
function setStatus(k,txt){
  var pill=$("statusPill"); pill.setAttribute("data-state",k); $("statusText").textContent=txt;
}

/* ======================================================
   MQTT
   ====================================================== */
function buildUrl(){
  return (MQTT_CONFIG.tls?"wss":"ws")+"://"+MQTT_CONFIG.host+":"+MQTT_CONFIG.port+MQTT_CONFIG.path;
}
function connectBroker(){
  if(mqttClient){try{mqttClient.end(true);}catch(e){} mqttClient=null;}
  stopDemo();
  setStatus("connecting","Menyambungkan…");
  var opts={
    clientId:MQTT_CONFIG.clientId,
    reconnectPeriod:4000, connectTimeout:8000, clean:true
  };
  if(MQTT_CONFIG.username) opts.username=MQTT_CONFIG.username;
  if(MQTT_CONFIG.password) opts.password=MQTT_CONFIG.password;
  try{ mqttClient=mqtt.connect(buildUrl(),opts); }
  catch(e){ setStatus("offline","Gagal tersambung"); startDemo(); return; }

  mqttClient.on("connect",function(){
    setStatus("live","Tersambung — Live");
    subscribeTopics();
  });
  mqttClient.on("reconnect",function(){ setStatus("connecting","Menyambungkan ulang…"); });
  mqttClient.on("close",function(){ setStatus("offline","Terputus"); });
  mqttClient.on("offline",function(){ setStatus("offline","Offline"); });
  mqttClient.on("error",function(){ setStatus("offline","Error koneksi"); });
  mqttClient.on("message",handleMessage);
}

function subscribeTopics(){
  var p=MQTT_CONFIG.prefix.replace(/\/$/,"");
  if(MQTT_CONFIG.mode==="json"){
    mqttClient.subscribe(MQTT_CONFIG.jsonTopic);
  } else {
    SENSORS.forEach(function(s){ mqttClient.subscribe(p+"/"+s.suffix); });
  }
  mqttClient.subscribe(MQTT_CONFIG.locTopic);
  mqttClient.subscribe(MQTT_CONFIG.vfdStatTopic);
  mqttClient.subscribe(MQTT_CONFIG.voltTopic);
  mqttClient.subscribe(MQTT_CONFIG.ampTopic);
  mqttClient.subscribe(MQTT_CONFIG.wattTopic);
}

function handleMessage(topic,payload){
  var str=payload.toString();
  console.log("[MQTT] topic:", topic, "| payload:", str);  // ← tambah ini
  
  var p=MQTT_CONFIG.prefix.replace(/\/$/,"");

  if(topic===MQTT_CONFIG.locTopic){
    var loc=tryParseLocation(str);
    if(loc) updateLocation(loc.lat,loc.lng,"MQTT");
    return;
  }
  if(topic===MQTT_CONFIG.vfdStatTopic){
    setVFDRunning(str.trim().toUpperCase()==="RUNNING");
    return;
  }
  if(topic===MQTT_CONFIG.voltTopic){ powerState.v=parseFloat(str); renderPower(); return; }
  if(topic===MQTT_CONFIG.ampTopic){  powerState.a=parseFloat(str); renderPower(); return; }
  if(topic===MQTT_CONFIG.wattTopic){ powerState.w=parseFloat(str); renderPower(); return; }

  if(MQTT_CONFIG.mode==="json"&&topic===MQTT_CONFIG.jsonTopic){
    try{
      var obj=JSON.parse(str);
      SENSORS.forEach(function(s){ if(obj[s.id]!==undefined) updateSensorValue(s.id,obj[s.id]); });
      if(obj.lat!==undefined&&obj.lng!==undefined) updateLocation(parseFloat(obj.lat),parseFloat(obj.lng),"MQTT");
    }catch(e){}
    return;
  }
  var match=SENSORS.find(function(s){ return topic===p+"/"+s.suffix; });
  if(match) updateSensorValue(match.id,str);
}

function tryParseLocation(str){
  str=str.trim();
  if(str[0]==="{"){
    try{ var o=JSON.parse(str); if(!isNaN(parseFloat(o.lat))&&!isNaN(parseFloat(o.lng))) return {lat:parseFloat(o.lat),lng:parseFloat(o.lng)}; }catch(e){}
    return null;
  }
  var pts=str.split(",");
  if(pts.length===2){ var la=parseFloat(pts[0]),ln=parseFloat(pts[1]); if(!isNaN(la)&&!isNaN(ln)) return {lat:la,lng:ln}; }
  return null;
}

/* ======================================================
   Init
   ====================================================== */
initMap();
SENSORS.forEach(function(s){ renderSensor(s); });

// Coba sambung broker; fallback ke demo jika gagal
connectBroker();
setTimeout(function(){
  if(!mqttClient || !mqttClient.connected){
    console.warn("MQTT gagal, fallback ke demo");
    startDemo();
  }
}, 6000);

})();
</script>
